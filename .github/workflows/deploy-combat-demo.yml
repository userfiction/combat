# ============================================================================
# deploy-combat-demo.yml — publish the @userfiction/combat demo UI to Pages
# ============================================================================
# This workflow lives in the combat repo (packages/userfiction/combat of the
# noobscript workspace is a standalone repo: git@github.com:userfiction/combat).
# GitHub Actions only reads .github/workflows/ from the repo root, so the file
# must sit here — not at the noobscript workspace root.
#
# Trigger: every push to `main` (plus manual dispatch). The demo is a pure
# static Vite app (demo/index.html + demo/main.ts, D12) — built with the
# package's own `demo:build` script and published via the official Pages
# actions (upload artifact → deploy).
#
# Requires one-time repo setup: Settings → Pages → Source = "GitHub Actions".
#
# Base path: project Pages serves this repo under
# https://userfiction.github.io/combat/, so the build must use --base=/combat/
# (Vite CLI overrides demo/vite.config.ts) or every asset/script URL 404s
# on Pages.
#
# Toolchain: Node 22 (Vite 8 engines: ^20.19 || >=22.12). Yarn 1 comes
# preinstalled on the runners (this repo pins no packageManager). The repo has
# no yarn.lock of its own yet, so the install is plain — no --frozen-lockfile —
# and setup-node caching is disabled (it requires a lockfile to hash).
# ----------------------------------------------------------------------------
name: Deploy combat demo

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One Pages deployment at a time; a newer push replaces an in-flight one
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: yarn install

            # Demo imports the library via relative ../index.ts (D12), so no
            # library build is needed first — demo:build is self-contained
            - name: Build combat demo
              run: yarn run demo:build --base=/combat/

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: demo/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
