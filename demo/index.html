<!doctype html>
<!-- ============================================================================
     demo/index.html — single-page shell for the @userfiction/combat demo (D12)
     Vanilla HTML/CSS/TS only: no React, no backend, no fetch. Every panel's
     DOM is BUILT by its ui/*.ts module into the mount point below, so the
     modules own their markup and the shell stays a stable skeleton.

     T3 UI: the duplicate "Combatant setup" (draft-driven) and "Entities"
     (read-only) panels are GONE — ONE live "Combatants" panel
     (ui/combatants.ts) renders snapshot.state and edits the running battle
     through Simulation.editCombatant. The JSON editor (ui/editor.ts) remains
     the original-definition / new-battle path ("Advanced battle definition /
     Apply & restart").
============================================================================ -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>@userfiction/combat — battle simulator demo</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <header class="top">
            <h1>Userfiction Combat — mock battle demo</h1>
            <!-- Trust boundary stated in the UI docs (D7 "Manifests vs code") -->
            <p class="trust">
                JSON definitions are strictly data — validated, never executed (no eval, no code from disk). The engine
                is synchronous; autoplay pacing lives in this UI only.
            </p>
        </header>

        <main class="layout">
            <div class="col col-left">
                <section class="panel" aria-label="Battle controls">
                    <h2>Battle</h2>
                    <div class="fixture-row">
                        <label for="fixture-select">Fixture</label>
                        <select id="fixture-select"></select>
                    </div>
                    <!-- controls.ts mounts Step / Run-Pause / Run-to-terminal / Reset / rate here -->
                    <div id="controls-mount"></div>
                    <!-- outcome banner: role=status announces terminal changes politely -->
                    <div id="banner" class="banner running" role="status"></div>
                </section>

                <!-- editor.ts mounts the Advanced definition textarea + Apply & restart +
                     Import/Export + error list (the new-battle path) -->
                <div id="editor-mount"></div>
            </div>

            <div class="col col-right">
                <!-- combatants.ts mounts the live per-combatant cards here:
                     state display + health/stats/gear/statuses/resources/injury editing -->
                <section class="panel" aria-label="Combatants">
                    <h2>Combatants</h2>
                    <div id="combatants-mount"></div>
                </section>

                <section class="panel" aria-label="Battle timeline">
                    <h2>Timeline</h2>
                    <!-- aria-live=polite mandated by D12; timeline.ts appends step groups -->
                    <div id="timeline-mount" class="timeline" aria-live="polite"></div>
                </section>

                <!-- snapshot.ts mounts the collapsible JSON view here -->
                <div id="snapshot-mount"></div>
            </div>
        </main>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
